<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a Secure Access account">
    <title>Create Account | Secure Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
    <div class="background">
        <span class="orb orb-one"></span>
        <span class="orb orb-two"></span>
        <span class="orb orb-three"></span>
    </div>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="brand">
                    <div class="brand-mark">SA</div>
                    <span>Secure Access</span>
                </a>

                <span class="eyebrow">CREATE ACCOUNT</span>
                <h1>Build your secure space.</h1>
                <p>Create your account to access the protected dashboard.</p>
            </div>

            <div id="registerMessage" class="message" role="alert" aria-live="polite"></div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">@</span>
                        <input
                            type="text"
                            id="registerUsername"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            maxlength="30"
                            aria-describedby="registerUsernameError"
                        >
                    </div>
                    <small id="registerUsernameError" class="field-error"></small>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉</span>
                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            maxlength="100"
                            aria-describedby="registerEmailError"
                        >
                    </div>
                    <small id="registerEmailError" class="field-error"></small>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">●</span>
                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            aria-describedby="registerPasswordError"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-target="registerPassword"
                            aria-label="Show password"
                        >Show</button>
                    </div>
                    <small id="registerPasswordError" class="field-error"></small>

                    <div class="password-panel">
                        <div class="strength-header">
                            <span>Password strength</span>
                            <strong id="strengthText">None</strong>
                        </div>

                        <div class="strength-bar">
                            <span id="strengthProgress"></span>
                        </div>

                        <div class="password-rules">
                            <span id="lengthRule" class="rule">
                                <b>✓</b> At least 8 characters
                            </span>
                            <span id="numberRule" class="rule">
                                <b>✓</b> At least 1 number
                            </span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">●</span>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            aria-describedby="confirmPasswordError"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >Show</button>
                    </div>
                    <small id="confirmPasswordError" class="field-error"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="registerButton">
                    <span class="button-text">Create Account</span>
                    <span class="button-loader"></span>
                </button>
            </form>

            <div class="auth-switch">
                <span>Already have an account?</span>
                <a href="login.html">Sign in</a>
            </div>

            <div class="demo-note">
                Client-side authentication demonstration only.
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
